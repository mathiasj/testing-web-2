    <rect x="428" y="140" width="24" height="12" rx="3" fill="url(#craneGradient)"/>
    <path d="M472 138L450 118H370L340 98" stroke="url(#craneGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M448 121L448 198" stroke="url(#craneGradient)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="448" cy="212" r="42" fill="url(#coinGradient)"/>
    <path d="M446 184C454 186 456 190 456 195C456 202 450 206 444 211C438 216 436 219 436 224C436 228 438 232 442 234" stroke="#C99A3D" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- House -->
  <g>
    <path d="M220 212L320 148L420 212V332H220V212Z" fill="url(#wallGradient)"/>
    <path d="M320 144L220 212H420L320 144Z" fill="url(#roofGradient)"/>
    <rect x="272" y="254" width="48" height="78" fill="#B4B9E8"/>
    <rect x="272" y="254" width="48" height="78" stroke="#7C82C3" stroke-width="4"/>
    <rect x="304" y="268" width="16" height="64" fill="#F5F6FF"/>
    <rect x="256" y="228" width="42" height="42" fill="#F5F6FF" stroke="#9298D1" stroke-width="6"/>
    <rect x="342" y="228" width="42" height="42" fill="#F5F6FF" stroke="#9298D1" stroke-width="6"/>
    <rect x="256" y="228" width="42" height="42" fill="#9DA3DA" opacity="0.2"/>
    <rect x="342" y="228" width="42" height="42" fill="#9DA3DA" opacity="0.2"/>
    <path d="M320 148L420 212V224L320 160L220 224V212L320 148Z" fill="#3D358C"/>
  </g>

  <!-- Coins -->
  <g opacity="0.9">
    <ellipse cx="184" cy="342" rx="28" ry="10" fill="#B7BBE7"/>
    <ellipse cx="456" cy="338" rx="30" ry="12" fill="#A6ACDE"/>
    <g transform="translate(154 316)">
      <ellipse cx="26" cy="17" rx="26" ry="12" fill="url(#coinGradient)"/>
      <ellipse cx="26" cy="10" rx="26" ry="12" fill="url(#coinGradient)" opacity="0.75"/>
    </g>
    <g transform="translate(440 304)">
      <ellipse cx="22" cy="14" rx="22" ry="9" fill="url(#coinGradient)"/>
      <ellipse cx="22" cy="7" rx="22" ry="9" fill="url(#coinGradient)" opacity="0.75"/>
    </g>
    <g transform="translate(210 332)">
