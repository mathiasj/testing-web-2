<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="480" viewBox="0 0 640 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="134" y1="41" x2="520" y2="427" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3D9FF"/>
      <stop offset="1" stop-color="#C2C9FF"/>
    </linearGradient>
    <linearGradient id="roofGradient" x1="320" y1="132" x2="320" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5247CF"/>
      <stop offset="1" stop-color="#312A89"/>
    </linearGradient>
    <linearGradient id="wallGradient" x1="320" y1="188" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F8FF"/>
      <stop offset="1" stop-color="#D8DBFF"/>
    </linearGradient>
    <linearGradient id="coinGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7D27A"/>
      <stop offset="1" stop-color="#F0C053"/>
    </linearGradient>
    <linearGradient id="craneGradient" x1="446" y1="78" x2="446" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9D89A"/>
      <stop offset="1" stop-color="#E4B76B"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="250" width="720" height="170" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="480" rx="32" fill="url(#bgGradient)"/>

  <g filter="url(#shadow)" opacity="0.4">
    <ellipse cx="320" cy="356" rx="220" ry="48" fill="#979CD6"/>
  </g>

  <!-- Crane -->
  <g>
